
spring.application.name=covoiturage
server.port=8080

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/covoiturage_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# --- JWT ---
# Valeur par defaut pour le DEVELOPPEMENT uniquement
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
jwt.expiration=86400000

# --- CORS ---
app.cors.allowed-origins=http://localhost:4200

# --- Compte administrateur ---
app.admin.email=${ADMIN_EMAIL:admin@covoiturage.tn}
app.admin.password=${ADMIN_PASSWORD:Admin@12345}

# ===================== Sprints 2 et 3 =====================

# --- OpenRouteService ---
ors.api.key=${ORS_API_KEY:}
ors.base-url=https://api.openrouteservice.org

# --- Prix ---
pricing.rate-per-km=0.30
pricing.max-factor=1.5

# --- Recherche ---
search.default-max-detour-km=5

# --- Emails ---
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@covoiturage.tn}

# --- DevOps ---
app.version=${APP_VERSION:dev}
