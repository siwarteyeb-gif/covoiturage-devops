
name: Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version cible (vide = version precedente)"
        required: false
        type: string

permissions:
  contents: read
  packages: read

jobs:
  rollback:
    name: Retour arriere sur PC local
    if: ${{ vars.LOCAL_DEPLOY == 'true' }}
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 20

    env:
      DEPLOY_DIR: 'C:\c\pj-serveur'
      APP_PORT: ${{ vars.APP_PORT || '8080' }}
      VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Git Bash
        shell: powershell
        run: |
          $gitBash = "C:\Program Files\Git\bin"
          if (!(Test-Path "$gitBash\bash.exe")) {
            throw "Git Bash introuvable"
          }
          $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verification de Docker et .env
        shell: powershell
        run: |
          docker info

          if (!(Test-Path "$env:DEPLOY_DIR\.env")) {
            throw "Fichier .env introuvable"
          }

      - name: Copier les scripts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:DEPLOY_DIR\scripts" | Out-Null

          Copy-Item "$env:GITHUB_WORKSPACE\scripts\*.sh" `
                    "$env:DEPLOY_DIR\scripts\" -Force

      - name: Retour arriere
        shell: bash
        run: |
          cd /c/c/pj-serveur
          chmod +x scripts/*.sh

          if [[ -n "$VERSION" ]]; then
            echo "==> Retour vers $VERSION"
            ./scripts/deploy.sh "$VERSION" --no-rollback
          else
            echo "==> Retour vers la version precedente"
            ./scripts/rollback.sh
          fi

      - name: Controle de sante
        shell: bash
        run: |
          cd /c/c/pj-serveur
          ./scripts/check.sh health "http://localhost:${APP_PORT}/health" 90

          echo "### Rollback termine" >> "$GITHUB_STEP_SUMMARY"
          echo "Version demandee : ${VERSION:-precedente}" >> "$GITHUB_STEP_SUMMARY"

