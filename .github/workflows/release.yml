
name: CD - Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [api, map-service, notification-service, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquettes de version
        run: |
          PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.service }}"
          SRC="$PREFIX:sha-${GITHUB_SHA::7}"
          VERSION="${GITHUB_REF_NAME}"
          PLAIN="${VERSION#v}"

          if ! docker buildx imagetools inspect "$SRC" > /dev/null 2>&1; then
            echo "::error::Image $SRC introuvable."
            exit 1
          fi

          TAGS=("-t" "$PREFIX:$VERSION" "-t" "$PREFIX:$PLAIN")

          if [[ "$PLAIN" != *-* ]]; then
            MAJOR="${PLAIN%%.*}"
            MINOR="${PLAIN%.*}"
            TAGS+=("-t" "$PREFIX:$MINOR" "-t" "$PREFIX:$MAJOR" "-t" "$PREFIX:latest")
          fi

          docker buildx imagetools create "${TAGS[@]}" "$SRC"

          echo "### ${{ matrix.service }} $VERSION" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "$PREFIX:$VERSION" | grep -E "^Digest" >> "$GITHUB_STEP_SUMMARY"

  github-release:
    needs: promote
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Release GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--generate-notes)
          [[ "$GITHUB_REF_NAME" == *-* ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" --title "$GITHUB_REF_NAME"

  deploy-local:
    name: Deploiement automatique sur PC local
    needs: [promote, github-release]

    if: ${{ vars.LOCAL_DEPLOY == 'true' && !contains(github.ref_name, '-') }}

    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25

    env:
      DEPLOY_DIR: 'C:\c\pj-serveur'
      APP_PORT: ${{ vars.APP_PORT || '8080' }}

    steps:
      - uses: actions/checkout@v4

      - name: Configurer Git Bash
        shell: powershell
        run: |
          $gitBash = "C:\Program Files\Git\bin"
          if (!(Test-Path "$gitBash\bash.exe")) {
            throw "Git Bash introuvable"
          }
          $gitBash | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "Git Bash configure."

      - name: Verification de Docker et du fichier .env
        shell: powershell
        run: |
          docker info

          if (!(Test-Path "$env:DEPLOY_DIR\.env")) {
            throw "Fichier .env introuvable dans $env:DEPLOY_DIR"
          }

      - name: Copier les fichiers de deploiement
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force "$env:DEPLOY_DIR\scripts" | Out-Null

          Copy-Item "$env:GITHUB_WORKSPACE\docker-compose.yml" `
                    "$env:DEPLOY_DIR\docker-compose.yml" -Force

          Copy-Item "$env:GITHUB_WORKSPACE\scripts\*.sh" `
                    "$env:DEPLOY_DIR\scripts\" -Force

          Write-Host "Fichiers de deploiement copies."
          Write-Host "Le fichier .env local est conserve."

      - name: Mise en service avec rollback automatique
        shell: bash
        run: |
          cd /c/c/pj-serveur
          chmod +x scripts/*.sh
          ./scripts/deploy.sh "$GITHUB_REF_NAME"

      - name: Controle de sante final
        shell: bash
        run: |
          ./scripts/check.sh health "http://localhost:${APP_PORT}/health" 90

          echo "### Version en service : $GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "Application : http://localhost:${APP_PORT}" >> "$GITHUB_STEP_SUMMARY"

