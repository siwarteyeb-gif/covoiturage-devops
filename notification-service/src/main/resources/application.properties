spring.application.name=notification-service
server.port=8082

# --- Emails : false = les messages sont seulement affiches dans la console (demonstration) ---
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@covoiturage.tn}

# Pour envoyer de vrais emails : MAIL_ENABLED=true + variables SPRING_MAIL_HOST, SPRING_MAIL_PORT,
# SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD (Spring les lit directement depuis l'environnement)
