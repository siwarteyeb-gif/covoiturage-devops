server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Route de sante (HEALTHCHECK Docker et controle apres mise en service)
  location = /health {
    access_log off;
    default_type text/plain;
    return 200 'ok';
  }

  # Passerelle : les appels /api sont transmis au service "api" (reseau interne Docker)
  location /api/ {
    proxy_pass http://api:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
  }

  # Application Angular : toutes les autres routes renvoient index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
