server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Les appels /api sont transmis au back-end (service "backend" de docker compose)
  location /api/ {
    proxy_pass http://backend:8080;
  }

  # Application Angular : toutes les autres routes renvoient index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
