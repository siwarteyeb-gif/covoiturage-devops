<div class="auth-card card">
  <h1>Connexion</h1>
  <p class="muted">Content de vous revoir !</p>

  @if (error()) {
    <div class="alert alert-error" role="alert">{{ error() }}</div>
  }

  <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <div class="form-group">
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" placeholder="vous@exemple.tn" />
      @if (err('email')) { <small class="error-text">{{ err('email') }}</small> }
    </div>

    <div class="form-group">
      <label for="password">Mot de passe</label>
      <input id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (err('password')) { <small class="error-text">{{ err('password') }}</small> }
    </div>

    <button type="submit" class="btn btn-primary btn-block" [disabled]="loading()">
      {{ loading() ? 'Connexion...' : 'Se connecter' }}
    </button>
  </form>

  <p class="auth-switch">Pas encore de compte ? <a routerLink="/register">Inscrivez-vous</a></p>
</div>
